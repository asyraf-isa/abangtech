<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abang Tech - Factory Smart Assistant</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root { 
            --primary: #004a99; 
            --secondary: #f4f7f9; 
            --accent: #ff9800; 
            --text: #333; 
            --user-bg: #0056b3;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #d1d9e6; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        /* Container Chat */
        .chat-card { 
            width: 100%; 
            max-width: 480px; 
            height: 90vh; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 10px 10px 30px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* Header */
        .chat-header { background: var(--primary); color: white; padding: 15px; text-align: center; }
        .chat-header h2 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* Role Selector */
        .role-selector { display: flex; background: #003366; padding: 8px; gap: 5px; }
        .role-btn { 
            flex: 1; border: none; background: #004a99; color: #fff; padding: 8px 2px; 
            cursor: pointer; border-radius: 6px; font-size: 0.7rem; font-weight: bold; 
            transition: 0.3s; opacity: 0.6;
        }
        .role-btn.active { background: var(--accent); opacity: 1; box-shadow: 0 0 10px rgba(255,152,0,0.5); }

        /* Safety Banner */
        .safety-banner { background: #fff3cd; color: #856404; font-size: 0.75rem; text-align: center; padding: 8px; font-weight: bold; border-bottom: 1px solid #ffeeba; }

        /* Chat Window */
        #chat-window { flex: 1; padding: 20px; overflow-y: auto; background: var(--secondary); display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 15px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .user-msg { background: var(--user-bg); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: white; color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #dee2e6; box-shadow: 2px 2px 5px rgba(0,0,0,0.03); }

        /* Formatting Markdown dalam Chat */
        .bot-msg p { margin: 8px 0; }
        .bot-msg p:first-child { margin-top: 0; }
        .bot-msg p:last-child { margin-bottom: 0; }
        .bot-msg ul, .bot-msg ol { padding-left: 20px; }

        /* Input Area */
        .chat-input { padding: 15px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input { flex: 1; border: 2px solid #eee; padding: 12px; border-radius: 10px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        button#send-btn { background: var(--primary); color: white; border: none; width: 50px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        button#send-btn:hover { background: #003366; }

        .typing { font-size: 0.8rem; color: #777; padding: 5px 20px; display: none; background: var(--secondary); }
    </style>
</head>
<body>

<div class="chat-card">
    <div class="chat-header">
        <h2><i class="fas fa-helmet-safety"></i> ABANG TECH</h2>
    </div>

    <div class="role-selector" id="roleGroup">
        <button class="role-btn active" onclick="setRole('Operator', this)">OPERATOR</button>
        <button class="role-btn" onclick="setRole('Technician', this)">TECHNICIAN</button>
        <button class="role-btn" onclick="setRole('Engineer', this)">ENGINEER</button>
        <button class="role-btn" onclick="setRole('Manager', this)">MANAGER</button>
    </div>
    
    <div class="safety-banner"><i class="fas fa-triangle-exclamation"></i> UTAMAKAN KESELAMATAN & SOP KILANG</div>

    <div id="chat-window">
        <div class="msg bot-msg">Selamat datang! Saya <b>Abang Tech</b>. Pilih jawatan anda di atas dan tanya saya apa-apa tentang teknikal kilang.</div>
    </div>

    <div id="typing" class="typing"><i class="fas fa-sync fa-spin"></i> Abang Tech sedang berfikir...</div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Tanya Abang Tech..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // --- KONFIGURASI (Tukar URL ini mengikut PythonAnywhere anda) ---
    const API_URL = "https://username.pythonanywhere.com/chat"; 
    const TOKEN = "AbangTechHensem123"; 

    let currentRole = 'Operator';

    // 1. Simpan Chat ke Storage (Refresh tak hilang)
    function saveChat() {
        const win = document.getElementById('chat-window');
        sessionStorage.setItem('abang_tech_history', win.innerHTML);
        sessionStorage.setItem('abang_tech_role', currentRole);
    }

    // 2. Load Chat bila page dibuka
    window.onload = function() {
        const savedChat = sessionStorage.getItem('abang_tech_history');
        const savedRole = sessionStorage.getItem('abang_tech_role');
        
        if (savedChat) {
            document.getElementById('chat-window').innerHTML = savedChat;
            document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;
        }
        
        if (savedRole) {
            currentRole = savedRole;
            document.querySelectorAll('.role-btn').forEach(btn => {
                if(btn.innerText.toUpperCase() === currentRole.toUpperCase()) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
    };

    function setRole(role, btn) {
        currentRole = role;
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const win = document.getElementById('chat-window');
        win.innerHTML += `<div class="msg bot-msg" style="font-style:italic; font-size:0.8rem; text-align:center; background:#eee">Mod ditukar kepada: <b>${role}</b></div>`;
        win.scrollTop = win.scrollHeight;
        saveChat();
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const win = document.getElementById('chat-window');
        const typing = document.getElementById('typing');
        
        if(!input.value.trim()) return;

        const msg = input.value;
        win.innerHTML += `<div class="msg user-msg">${msg}</div>`;
        input.value = '';
        win.scrollTop = win.scrollHeight;
        saveChat();

        typing.style.display = 'block';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-Custom-Token': TOKEN 
                },
                body: JSON.stringify({ message: msg, role: currentRole })
            });

            const data = await response.json();
            console.log("Response:", data); // Untuk semakan di F12 Console

            typing.style.display = 'none';

            if(response.status === 200) {
                // TUKAR MARKDOWN KE HTML
                const formattedReply = marked.parse(data.reply);
                win.innerHTML += `<div class="msg bot-msg">${formattedReply}</div>`;
            } else {
                win.innerHTML += `<div class="msg bot-msg" style="color:red">Akses ditolak atau server sibuk. (Status: ${response.status})</div>`;
            }
            
        } catch (err) {
            typing.style.display = 'none';
            console.error("Error:", err);
            win.innerHTML += `<div class="msg bot-msg" style="color:red">Maaf, gangguan talian. Cuba lagi.</div>`;
        }

        win.scrollTop = win.scrollHeight;
        saveChat();
    }
</script>

</body>
</html>
